# .github/workflows/fred-backfill.yml
# Backfill lịch sử FRED từ 2026-01-01 → kho online (chạy 1 lần theo yêu cầu).
# Mỗi ngày 1 file research/fred/history/YYYY-MM-DD.json (point-in-time chính xác).
name: FRED history backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Ngày bắt đầu (YYYY-MM-DD)'
        required: false
        default: '2026-01-01'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full history & build daily snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse, datetime

          key = os.environ['FRED_API_KEY']
          start = os.environ.get('START_DATE', '2026-01-01')
          series_ids = ['DGS2', 'DGS10', 'DFII10', 'DTWEXBGS', 'T10YIE']
          today = datetime.date.today()

          def fetch_series(sid):
              params = urllib.parse.urlencode({
                  'series_id': sid, 'api_key': key, 'file_type': 'json',
                  'observation_start': start, 'sort_order': 'asc', 'limit': 100000,
              })
              url = f'https://api.stlouisfed.org/fred/series/observations?{params}'
              req = urllib.request.Request(url, headers={'User-Agent': 'NexusPilot/1.0'})
              d = json.load(urllib.request.urlopen(req, timeout=60))
              pts = []
              for o in d.get('observations', []):
                  if o['value'] == '.': continue
                  pts.append((o['date'], float(o['value'])))
              return pts

          # Tải toàn bộ
          all_pts = {}
          for sid in series_ids:
              all_pts[sid] = fetch_series(sid)
              print(f'{sid}: {len(all_pts[sid])} điểm từ {start}')

          # Dựng snapshot từng ngày (point-in-time)
          os.makedirs('/tmp/fred-history', exist_ok=True)
          day = datetime.date.fromisoformat(start)
          count = 0
          while day <= today:
              ds = day.isoformat()
              snap = {'asOf': ds, 'fetchedAt': datetime.datetime.utcnow().isoformat() + 'Z',
                      'source': 'backfill', 'series': {}}
              ok = 0
              for sid in series_ids:
                  pts = all_pts[sid]
                  # điểm mới nhất <= ngày hiện tại
                  latest = None; prev = None
                  for i, (d, v) in enumerate(pts):
                      if d <= ds:
                          prev = latest; latest = (d, v)
                      else: break
                  if latest:
                      ok += 1
                      snap['series'][sid] = {'date': latest[0], 'value': latest[1],
                          'prevDate': prev[0] if prev else None, 'prevValue': prev[1] if prev else None}
                  else:
                      snap['series'][sid] = {'date': '', 'value': None}
              if ok >= 3:  # chỉ lưu ngày có đủ dữ liệu
                  with open(f'/tmp/fred-history/{ds}.json', 'w') as f:
                      json.dump(snap, f)
                  count += 1
              day += datetime.timedelta(days=1)
          print(f'Đã dựng {count} snapshot ngày')
          EOF

      - name: Push to data branch
        env:
          PAT: ${{ secrets.FRED_PUSH_PAT }}
        run: |
          git config --global user.name "fred-bot"
          git config --global user.email "fred-bot@users.noreply.github.com"
          rm -rf data-br && git clone --depth 1 --branch data \
            "https://x-access-token:${PAT}@github.com/hayhahen-ui/mt5-mrbit-2026.git" data-br
          mkdir -p data-br/research/fred/history
          cp /tmp/fred-history/*.json data-br/research/fred/history/
          cd data-br
          git add research/fred/history/
          git diff --cached --quiet && echo "Không có gì mới" && exit 0
          N=$(git diff --cached --name-only | wc -l)
          git commit -m "fred backfill: ${N} ngày lịch sử từ 2026-01-01"
          git push origin data
          echo "Đã đẩy ${N} file lịch sử"
